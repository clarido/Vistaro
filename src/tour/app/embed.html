<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="__ROOT__app.css">
</head>
<!-- Generated by `tour --embed`. One scenario, no rail, no page chrome: the same shell in solo mode,
     so the canvas, the captions and the transport behave exactly as they do in the full tour. -->
<body class="solo" data-scenario="__SCENARIO__" data-device="__DEVICE__" data-autoplay="__AUTOPLAY__" data-origin="__ORIGIN__">
  <main>
    <section class="stage-col" id="stage-col">
      <div class="cap-top" aria-live="polite">
        <span class="eyebrow" id="eyebrow"></span>
        <h2 id="cap-title">Loading…</h2>
      </div>

      <div class="stage" id="stage">
        <div class="screen" id="screen"></div>
        <div class="veil" id="veil" hidden><button class="play-big" id="play-big" aria-label="Play">▶</button></div>
        <div class="fallback" id="fallback" hidden>
          <div class="fallback-icon" aria-hidden="true">⤢</div>
          <p class="fallback-title" id="fallback-title"></p>
          <p class="fallback-body" id="fallback-body"></p>
        </div>
      </div>

      <div class="cap-bottom">
        <p id="cap-body"></p>
        <span class="cap-next" id="cap-next"></span>
      </div>

      <div class="controls" id="controls">
        <button id="btn-restart" title="Start over" aria-label="Start over">↺</button>
        <button id="btn-prev" title="Previous step" aria-label="Previous step">‹</button>
        <button id="btn-play" class="primary" title="Play" aria-label="Play">▶</button>
        <button id="btn-next" title="Next step" aria-label="Next step">›</button>
        <div class="ticks" id="ticks" role="group" aria-label="Steps"></div>
        <div class="stepmenu">
          <button id="btn-steps" type="button" title="Steps" aria-expanded="false" aria-haspopup="true" disabled>
            <span class="count" id="count"></span>
            <span class="chev" aria-hidden="true">▾</span>
          </button>
          <div class="menu" id="steps-menu" role="group" aria-label="Steps" hidden></div>
        </div>
        <button id="btn-full" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      </div>
    </section>
  </main>

  <script>window.__TOUR_CHROME__ = __CHROME__;</script>
  <script src="__ROOT__app.js"></script>
</body>
</html>
