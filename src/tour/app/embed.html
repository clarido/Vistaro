<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="__ROOT__app.css">
</head>
<!-- Generated by `tour --embed`. One scenario, no rail, no page chrome: the same shell in solo mode,
     so the canvas, the caption and the transport behave exactly as they do in the full tour. -->
<body class="solo" data-scenario="__SCENARIO__" data-device="__DEVICE__" data-autoplay="__AUTOPLAY__" data-origin="__ORIGIN__">
  <main>
    <section class="stage-col">
      <div class="stage" id="stage">
        <div class="screen" id="screen"></div>
        <div class="veil" id="veil" hidden><button class="play-big" id="play-big" aria-label="Play">▶</button></div>
      </div>

      <div class="caption" id="caption">
        <span class="eyebrow" id="eyebrow"></span>
        <h2 id="cap-title">Loading…</h2>
        <p id="cap-body"></p>
      </div>

      <div class="controls" id="controls">
        <button id="btn-restart" title="Start over" aria-label="Start over">↺</button>
        <button id="btn-prev" title="Previous step" aria-label="Previous step">‹</button>
        <button id="btn-play" class="primary" title="Play" aria-label="Play">▶</button>
        <button id="btn-next" title="Next step" aria-label="Next step">›</button>
        <div class="ticks" id="ticks" role="tablist" aria-label="Steps"></div>
        <span class="count" id="count"></span>
        <button id="btn-full" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      </div>
    </section>
  </main>

  <script src="__ROOT__app.js"></script>
</body>
</html>
