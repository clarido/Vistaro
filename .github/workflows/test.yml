# Typecheck, docs drift and the full test suite on every push and pull request.
# Expect roughly 12 to 15 minutes: the suite runs serially (--test-concurrency=1) and most of it
# drives a real Chromium and encodes video with ffmpeg. The test job needs no secrets; the narration
# test skips off macOS, and nothing there reaches the network beyond npm and the browser download.
#
# Two more jobs:
# - release: a v* tag publishes the package to npm through trusted publishing (OIDC, no token).
#   It waits for the suite, so a red build can never be published.
# - deploy-website: every push to main (and "Run workflow" on main, workflow_dispatch) rsyncs
#   vistaro.dev to the VPS as the restricted vistaro-deploy user (secret VISTARO_DEPLOY_KEY).
#   Every push, not only website/ changes: the site's videos and tours are built from demo/,
#   reels/ and showcase/ too, and unchanged demos come from the cache, so a deploy costs about a
#   minute. It does not wait for the suite: the demos are built by the CLI itself, so a broken CLI
#   already fails the deploy at its build step, and the site goes live in minutes instead of after
#   the 15-minute suite. The run's summary page says what was deployed.
# They live here rather than in their own files because test/ci-workflow.test.ts requires every
# workflow to carry the three checks.
name: test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # release and deploy-website come first on purpose: test/ci-workflow.test.ts reads a step as
  # running until the next step starts, so a job-level `if:` placed after the npm test step would
  # read as guarding it. GitHub orders jobs by `needs:`, not by position in the file.
  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'   # ships npm 11, which trusted publishing needs
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # prepublishOnly (tsc + docs:check) needs the dependencies, not the browser.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm publish --access public

  deploy-website:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-website
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The demos the pages play (videos, embeds, tours) are generated and gitignored, so the
      # checkout never has them. They are cached under a hash of everything they are built from:
      # unchanged sources restore them in seconds and skip Node, Chromium and every build below.
      # vistaro.manifest.json is excluded because each build appends to it.
      - name: Restore the built demos
        id: demos
        uses: actions/cache/restore@v4
        with:
          path: |
            website/assets/reel.mp4
            website/src/reel/embed-desktop.html
            website/src/showcase-out
            website/src/clarido-tour-out
            website/src/clarido-tour-fr-out
            website/assets/clarido-demo.mp4
            website/src/ask-anything
            website/assets/ask-anything.mp4
            website/assets/ask-anything-mobile.mp4
          key: website-demos-v1-${{ hashFiles('src/**', 'cli.ts', 'package-lock.json', 'demo/**', 'showcase/**', 'reels/**', 'website/src/reel/**', 'tour.showcase.json', 'tour.website.json', 'tour.website-fr.json', '.github/workflows/test.yml', '!**/vistaro.manifest.json') }}

      - uses: actions/setup-node@v4
        if: steps.demos.outputs.cache-hit != 'true'
        with:
          node-version: '20.x'
          cache: npm

      - if: steps.demos.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.demos.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.demos.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build the reel
        if: steps.demos.outputs.cache-hit != 'true'
        run: |
          npx tsx cli.ts build website/src/reel --embed --device desktop
          npx tsx cli.ts export website/src/reel -o website/assets/reel.mp4 -w 1280 -H 720 --scale 2

      # The stage is mirrored with --delete, so a demo neither restored nor rebuilt here would
      # vanish from vistaro.dev (the stage step's file list refuses that).
      - name: Build the tours, the demo video and the product reel
        if: steps.demos.outputs.cache-hit != 'true'
        run: |
          npx tsx cli.ts tour tour.showcase.json --embed -o website/src/showcase-out
          npx tsx cli.ts tour tour.website.json --embed
          npx tsx cli.ts tour tour.website-fr.json --embed
          npx tsx cli.ts export demo -o website/assets/clarido-demo.mp4 -w 1280 -H 720 --no-chapters
          npx tsx cli.ts build reels/ask-anything --embed --device desktop
          mkdir -p website/src/ask-anything
          cp reels/ask-anything/embed-desktop.html website/src/ask-anything/embed-desktop.html
          npx tsx cli.ts export reels/ask-anything -o website/assets/ask-anything.mp4 -w 1280 -H 720 --scale 2
          # The phone cut for formats.html: same screen, --device mobile.
          npx tsx cli.ts build reels/ask-anything --embed --device mobile
          cp reels/ask-anything/embed-mobile.html website/src/ask-anything/embed-mobile.html
          npx tsx cli.ts export reels/ask-anything --device mobile --scale 2 -o website/assets/ask-anything-mobile.mp4

      # Same paths as the restore step; saved only after every build above succeeded.
      - name: Save the built demos
        if: steps.demos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            website/assets/reel.mp4
            website/src/reel/embed-desktop.html
            website/src/showcase-out
            website/src/clarido-tour-out
            website/src/clarido-tour-fr-out
            website/assets/clarido-demo.mp4
            website/src/ask-anything
            website/assets/ask-anything.mp4
            website/assets/ask-anything-mobile.mp4
          key: ${{ steps.demos.outputs.cache-primary-key }}

      - name: Stage the site
        run: |
          rsync -a --exclude '.DS_Store' --exclude 'reel.gif' --exclude 'reel.poster.png' \
            --exclude 'reel.webm' --exclude '*.snippet.html' --exclude 'src/reel/animated.html' \
            --exclude 'src/reel/vistaro.*' --exclude 'src/reel/index.html' \
            --exclude 'ask-anything.gif' --exclude 'ask-anything.webm' --exclude 'ask-anything.poster.png' \
            --exclude 'ask-anything-mobile.gif' --exclude 'ask-anything-mobile.webm' --exclude 'ask-anything-mobile.poster.png' \
            --no-links --chmod=D755,F644 website/ "$RUNNER_TEMP/site/"
          for f in index.html start.html animations.html formats.html assets/reel.mp4 assets/clarido-demo.mp4 \
                   assets/ask-anything.mp4 src/ask-anything/embed-desktop.html \
                   assets/ask-anything-mobile.mp4 src/ask-anything/embed-mobile.html \
                   src/showcase-out/tours.json src/clarido-tour-out/tours.json src/clarido-tour-fr-out/tours.json; do
            test -f "$RUNNER_TEMP/site/$f" || { echo "::error::missing $f, refusing to deploy"; exit 1; }
          done

      - name: Upload to vistaro.dev
        env:
          DEPLOY_KEY: ${{ secrets.VISTARO_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key of vpsovh (ED25519 SHA256:gyQmJjKfQE2A1rREf2Oh8X/pDqTZNDRNT8EffNCQHvI).
          echo '158.69.214.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFJ+tEy/1e6G+6mhTK4nPe5L0mZurLHzY1MmaZhEL0hO' > ~/.ssh/known_hosts
          # --delete makes the live folder mirror the stage: an empty stage would wipe vistaro.dev.
          test -f "$RUNNER_TEMP/site/index.html" || { echo "::error::empty stage, refusing to deploy"; exit 1; }
          # The key is locked server-side to write-only rrsync in /opt/static-sites/vistaro, so ./ is
          # that folder. No symlinks travel: Caddy serves this folder and a link could expose /data.
          rsync -rpt --delete --no-links -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "$RUNNER_TEMP/site/" vistaro-deploy@158.69.214.113:./
          # A green job must say what it did: write the result on the run's summary page.
          files=$(find "$RUNNER_TEMP/site" -type f | wc -l | tr -d ' ')
          size=$(du -sh "$RUNNER_TEMP/site" | cut -f1)
          demos=$([ "${{ steps.demos.outputs.cache-hit }}" = "true" ] && echo "restored from cache" || echo "rebuilt")
          echo "Deployed https://vistaro.dev from ${GITHUB_SHA:0:7}: $files files, $size, demos $demos." >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'   # engines.node is >=20.6 (node --import)
          cache: npm

      - run: npm ci

      # Chromium is ~130MB; keyed on the lock file so a Playwright bump re-downloads it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # --with-deps installs the system libraries even when the browser itself was cached.
        run: npx playwright install --with-deps chromium

      - name: CLI reference is up to date
        run: npm run docs:check

      - name: Typecheck
        run: npx tsc --noEmit

      # npm test chains `node saas/smoke.mjs` after the node:test suite (package.json), so the
      # SaaS HTTP contract is exercised in this step too; a separate smoke step would run it twice.
      - name: Test
        run: npm test
